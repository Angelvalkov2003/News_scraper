 Rahmi M. Koç’un, Koç Topluluğu'nun Cumhuriyet'in 100. yılı ve topluluğun 97. yılı onuruna hazırladığı röportajlar serisinde yaptığı \"Devlette 5,5 milyon kişi çalışıyor. Dolayıs","thumb":{"src":"https://www.dogrulukpayi.com/images/article/turkiye-de-memur-sayisi-fazla-mi.jpg","width":1440,"height":1222},"structuredData":[{"@context":"http://schema.org","@graph":[{"@type":"Organization","logo":{"@type":"ImageObject","url":"https://www.dogrulukpayi.com/build/front-end/img/website_logo@2x.png","width":800,"height":500},"name":"Doğruluk Payı","@id":"#Publisher","address":{"@type":"PostalAddress","addressCountry":"Turkey","addressLocality":"Istanbul"},"description":"Doğruluk Payı'nın videolu analizlerine bu bölümden erişebilirsiniz.","foundingDate":2014,"legalName":"İzlemedeyiz Derneği","sameAs":["https://twitter.com/dogrulukpayicom","https://www.facebook.com/dogrulukpayi/","https://www.instagram.com/dogrulukpayi/","https://www.youtube.com/c/Dogrulukpayicom","https://tr.linkedin.com/company/dogrulukpayi","https://eksisozluk.com/biri/dogrulukpayi"],"url":"https://dogrulukpayi.com"},{"@type":"Article","speakable":{"@type":"SpeakableSpecification","xpath":["/html/head/title","/html/head/meta[@name='description']/@content"]},"thumbnailUrl":"https://www.dogrulukpayi.com/images/article/turkiye-de-memur-sayisi-fazla-mi.jpg","image":{"@type":"ImageObject","url":"https://www.dogrulukpayi.com/images/article/turkiye-de-memur-sayisi-fazla-mi.jpg","width":1440,"height":1222},"mainEntityOfPage":"https://www.dogrulukpayi.com/bulten/turkiye-de-memur-sayisi-fazla-mi","headline":"Türkiye’de Memur Sayısı Fazla mı?","description":"Türkiye’de kamuda çalışan kişi sayısı gündemi dönem dönem meşgul eden konuların başında geliyor. Koç Holding Şeref Başkanı Rahmi M. Koç’un, Koç Topluluğu'nun Cumhuriyet'in 100. yılı ve topluluğun 97. yılı onuruna hazırladığı röportajlar serisinde yaptığı \"Devlette 5,5 milyon kişi çalışıyor. Dolayıs","datePublished":"2024-07-03T14:57:47+03:00","dateModified":"2026-02-11T12:40:58+03:00","author":[{"@type":"Person","name":"Murat İltir","image":"https://www.dogrulukpayi.com/images/user/murat-iltir-140.jpg","url":"https://www.dogrulukpayi.comhttps://www.dogrulukpayi.com/ekibimiz/murat-iltir","sameAs":["https://www.linkedin.com/in/muratiltir/","https://www.twitter.com/muratiltir","https://www.instagram.com/muratiltir"]},{"@type":"Person","name":"Eylül Büyüktunca","image":"https://www.dogrulukpayi.com/images/user/eylul-buyuktunca-135.jpg","url":"https://www.dogrulukpayi.comhttps://www.dogrulukpayi.com/ekibimiz/eylul-buyuktunca"}],"publisher":{"@type":"Organization","logo":{"@type":"ImageObject","url":"https://www.dogrulukpayi.com/build/front-end/img/website_logo@2x.png","width":800,"height":500},"name":"Doğruluk Payı"},"keywords":"istihdam,Kamu İstihdamı,Memur,Memur Sayısı,kamu çalışanı,kamu çalışanı sayısı,türkiye'de memur sayısı"},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Bülten","item":"https://www.dogrulukpayi.com/bultenler"}]}]}]},"duration":5,"contentBlocks":{"time":1770802857853,"blocks":[{"id":"s179FRBvTL","data":{"text":"\u003cbr\u003eTürkiye’de kamuda çalışan kişi sayısı, 2026’da da ekonomik dalgalanmalar ve gelir adaletsizliği tartışmalarıyla birlikte yeniden gündemde. Sosyal medyada bu tartışma çoğunlukla, asgari ücrete sınırlı zam yapılması ve enflasyon karşısında alım gücü düşen özel sektör çalışanları ile, yıl içinde enflasyon farkı ve toplu sözleşmelerle maaş artışı alan kamu çalışanlarının karşılaştırılması üzerinden yürütülüyor. Bu durum, kamu istihdamının görece güvenceli yapısının, artan hayat pahalılığı koşullarında daha fazla sorgulanmasına yol açıyor. Ancak mesele yalnızca maaş artışlarıyla sınırlı değil. Tartışmanın bir diğer konusu kamu kesiminde çalışma rejimindeki sağlıksız yapı ve artan yolsuzluk algısıyla ilgili."},"type":"paragraph"},{"id":"ejmIsfRDHJ","data":{"text":"Bu yüzden “Türkiye’de memur sayısı fazla mı?” sorusuna verilecek bir cevapta olgular kadar yapısal sorunlardan kaynaklı algılara da yer vermek gerek.\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e"},"type":"paragraph"},{"id":"eY-kD8WPwf","data":{"text":"2025 IV. Çeyrekte Kamu İstihdamının Toplam İstihdama Oranı Yüzde 16,3","level":3},"type":"header"},{"id":"RPgTyX8nKf","data":{"text":"Türkiye Cumhuriyeti Cumhurbaşkanlığı Strateji ve Bütçe Başkanlığı’nın 2025 4. Çeyrek verilerine göre, Aralık 2025 itibarıyla toplam kamu personel sayısı 5.342.254 kişi. Bu kamu personeli sayısının %65,5’ini kadrolu, %8,6’sını ise sözleşmeli personeller oluşturuyor. Yaklaşık 1,3 milyon kamu işçisi ise toplam kamu personeli sayısının %24’üne tekabül ediyor."},"type":"paragraph"},{"id":"Rbc8yKI2Hv","data":{"text":"TÜİK tarafından açıklanan\u003ca href=\"https://data.tuik.gov.tr/Bulten/Index?p=Isgucu-Istatistikleri-Aralik-2025-57982#:~:text=%C4%B0stihdam%20edilenlerin%20say%C4%B1s%C4%B1%202025%20y%C4%B1l%C4%B1,%31%2C7%20olarak%20ger%C3%A7ekle%C5%9Fti.\"\u003e İşgücü İstatistiklerine\u003c/a\u003e’ne göre Türkiye’de Aralık 2025 itibarıyla istihdamdaki nüfus sayısı 32 milyon 685 bin kişi. Yapılan hesaplama 2025 için Türkiye’deki kamu personeli sayısının toplam istihdamın %16,3’ü olduğunu gösteriyor.\u0026nbsp;"},"type":"paragraph"},{"id":"jzuGfllRGx","data":{"title":"\u003cb\u003e2025, 4. Çeyrek\u003c/b\u003e","caption":"","content":[["\u003cb\u003eToplam\u0026nbsp;\u003c/b\u003e","\u003cb\u003e5.342.254\u003c/b\u003e"],["\u003cb\u003eKadrolu Personel\u003c/b\u003e","\u003cb\u003e3.501.260\u003c/b\u003e"],["\u003cb\u003eSözleşmeli Personel\u003c/b\u003e","\u003cb\u003e462.090\u003c/b\u003e"],["\u003cb\u003eSürekli İşçi\u003c/b\u003e","\u003cb\u003e1.240.647\u003c/b\u003e"],["\u003cb\u003eGeçici İşçi\u0026nbsp;\u003c/b\u003e","\u003cb\u003e40.371\u003c/b\u003e"],["\u003cb\u003eDiğer\u003c/b\u003e","\u003cb\u003e97.886\u003c/b\u003e"]],"withHeadings":false,"withRowHeadings":false},"type":"table"},{"id":"TYlk7ijIDv","data":{"text":"Türkiye’de Kamu Çalışan Oranı OECD Ortalamasının Altında","level":3},"type":"header"},{"id":"B07eN790-U","data":{"text":"Türkiye’deki kamu çalışan oranı OECD ülkeleriyle karşılaştırılabilir. OECD her yıl kamu sektörünün büyüklüğü, kamu çalışanlarının dağılımı ve kamu hizmetlerinin etkinliği gibi konular ele alan, kamu yönetimi ve kamu istihdamı konularında geniş kapsamlı veriler sunan “\u003ca href=\"https://www.oecd.org/en/publications/government-at-a-glance-2025_0efd0bcd-en.html\"\u003eBir Bakışta Hükümet\u003c/a\u003e” adlı raporunu yayımlıyor. 2025 raporunda son veriler OECD’ye üye ülkelerin 2023 yılı kamu çalışan oranı verilerini içeriyor. 2023 verilerine göre toplam istihdam içinde kamu istihdam oranında OECD ortalaması %18,4. 2023 yılı için Türkiye’de bu oran %13 olarak kaydedilmiş ve Türkiye 38 ülke içinde 31. olarak yer almış. Türkiye’nin en güncel verisini dikkate alsak bile kamu çalışan oranında OECD ortalamasının gerisinde olduğu görülebiliyor.\u0026nbsp;"},"type":"paragraph"},{"id":"DKmaDX6ikI","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/18598471/embed?auto=1' width=400 height=1000\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/18598471/?utm_source=embed\u0026amp;utm_campaign=visualisation/18598471'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/18598471/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:1600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e\u003cdiv style='width:100%!;margin-top:4px!important;text-align:right!important;'\u003e\u003ca class='flourish-credit' href='https://public.flourish.studio/visualisation/18598471/?utm_source=embed\u0026amp;utm_campaign=visualisation/18598471' target='_top' style='text-decoration:none!important'\u003e\u003cimg alt='Made with Flourish' src='https://public.flourish.studio/resources/made_with_flourish.svg' style='width:105px!important;height:16px!important;border:none!important;margin:0!important;'\u003e \u003c/a\u003e\u003c/div\u003e","caption":""},"type":"customEmbed"},{"id":"EcWR3-fJwi","data":{"text":"Bu alanda en yüksek oransa İskandinav ülkelerine ait. Toplam istihdam içinde kamu çalışanı oranının en yüksek olduğu ülkeler yüzde 30 ile Norveç, yüzde 28,2 ile İsveç, yüzde 27,3 ile Danimarka ve yüzde 25,2 ile Finlandiya. En düşük oranlara sahip ülkelerse yüzde 4,9 ile Japonya ve yüzde 8,5 ile Şili."},"type":"paragraph"},{"id":"fRyLvqz99z","data":{"text":"OECD’nin verilerinde Avrupa’da Türkiye’nin yüzde 13 oranından daha düşük orana sahip yedi ülke bulunuyor. Yüzde 11.48’lik oranla İsviçre bu alanda Avrupa’da en düşük orana sahip ülke olurken, İsviçre'yi yüzde 11,53’lük oranla İsviçre ve yüzde 12,3’lük oranla Hollanda takip ediyor."},"type":"paragraph"},{"id":"K61iqzuTbK","data":{"text":"Kamu İstihdamında Kadın Oranı Yalnızca Yüzde 33,6","level":3},"type":"header"},{"id":"_k3li6AVfT","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/18598502/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/18598502/?utm_source=embed\u0026amp;utm_campaign=visualisation/18598502'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/18598502/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:1600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e\u003cdiv style='width:100%!;margin-top:4px!important;text-align:right!important;'\u003e\u003ca class='flourish-credit' href='https://public.flourish.studio/visualisation/18598502/?utm_source=embed\u0026amp;utm_campaign=visualisation/18598502' target='_top' style='text-decoration:none!important'\u003e\u003cimg alt='Made with Flourish' src='https://public.flourish.studio/resources/made_with_flourish.svg' style='width:105px!important;height:16px!important;border:none!important;margin:0!important;'\u003e \u003c/a\u003e\u003c/div\u003e","caption":""},"type":"customEmbed"},{"id":"mXuw8knhhk","data":{"text":"OECD verilerinde yer alan kamu sektöründeki cinsiyet ayrımı incelendiğinde OECD üye ülkelerinde kadın istihdamının erkek istihdamından daha fazla olduğu bir eğilim görülüyor. Ancak Türkiye’de durum farklı seyrediyor. TÜİK’in Nisan 2024’e ilişkin İşgücü İstatistiklerine göre \u003ca href=\"https://data.tuik.gov.tr/Bulten/Index?p=Isgucu-Istatistikleri-Nisan-2024-53511\"\u003eistihdam oranı\u003c/a\u003e erkeklerde yüzde 66,9’ken kadınlarda yüzde 32,5 olarak gerçekleşti. OECD verilerine göre de bu durum kamuda da kendini gösteriyor. \u003cbr\u003e\u003cbr\u003eÖrneğin Litvanya'da kamuda çalışanların yüzde 79.3’ü, Portekiz yüzde 75’i, Birleşik Krallık’ta yüzde 54.6’sı, Fransa’da yüzde 62.7’si kadınken Türkiye’de bu oran yüzde 33.7. Bu oranla Türkiye 42 ülke arasında en düşük ikinci orana sahip ülke olarak öne çıkarken, listenin en altında yüzde 32.7'lik oranla Japonya bulunuyor.\u0026nbsp;"},"type":"paragraph"},{"id":"6NC02DMmf9","data":{"text":"Kamu Sendikacılığı: Güçlü mü, Bağımlı mı?","level":3},"type":"header"},{"id":"AS6jBQN7TH","data":{"text":"Çalışma ve Sosyal Güvenlik Bakanlığı tarafından yayınlanan çalışma istatistiklerine göre 2024’te Türkiye’de işçiler arasında \u003ca href=\"https://www.csgb.gov.tr/media/95252/bolum-1-calisma-istatistikleri-2023.xlsx\"\u003esendikalaşma oranı\u003c/a\u003e %13,2. Bu oran \u003ca href=\"https://www.csgb.gov.tr/media/95253/bolum-2-kamu-gorevlileri-2023.xlsx\"\u003ekamu görevlilerinde\u003c/a\u003e ise %75,6’ya çıkıyor.\u0026nbsp;"},"type":"paragraph"},{"id":"9kPQ6otHWA","data":{"text":"Türkiye’deki kamu görevlileri özelinde yüksek sendikalaşma oranlarının, kamu görevlilerinin örgütlenme bilincine sahip olduklarını gösterip göstermediğiyse oldukça tartışmalı bir konu. 2001’de kabul edilen 4688 sayılı Kamu Görevlileri Sendikaları Kanunu kamu çalışanlarının sendikalaşma ve toplu görüşme süreçlerini düzenleyen ilk özel yasa olurken, bu yasayla kamu görevlilerinin sendikal hakları yasal bir çerçeveye oturtuldu.\u0026nbsp; Bu kanunla\u0026nbsp; kamu çalışanlarının sendikalaşma hakkı detaylandırıldı ve toplu görüşme sürecini tanımlandı. En çok üyeye sahip sendikalar toplu görüşmelerde avantajlı hale getirildi.\u0026nbsp;"},"type":"paragraph"},{"id":"0xlknJ4Gom","data":{"text":"2010 yılında yapılan anayasa değişikliğiyle ise Anayasa'nın 53. maddesi yeniden düzenlendi ve kamu görevlilerine toplu sözleşme hakkı tanındı. Ancak bu hak, grevi içermeyen zorunlu tahkim mekanizması ile sınırlandırıldı."},"type":"paragraph"},{"id":"t1TJwj4pFJ","data":{"text":"Kamu sendikacılığında 21. yüzyıl Türkiye’sinde bu değişimler yaşanırken sendikalı üye sayısında da kayda değer bir artış yaşandı. 2 Temmuz 2002 tarihli \u003ca href=\"https://www.csgb.gov.tr/media/1673/2002_uyesayilari.pdf\"\u003eResmi Gazete\u003c/a\u003e’de 650 bin 770 kişi olarak belirtilen sendikalı kamu emekçisi sayısı, 2026 yılındaki\u003ca href=\"https://www.csgb.gov.tr/%C4%B1statistikler/calisma-hayati-%C4%B1statistikleri/sendikal-%C4%B1statistikler/isci-sayilari-ve-sendikalarin-uye-sayilari-hakkinda-tebligler/\"\u003e resmi verilere göre \u003c/a\u003eyaklaşık 2,5 milyon. Açıklanan resmi verilerde emekçilerin üye olduğu konfederasyonlar da ayrıca dikkat çekiyor.\u0026nbsp;"},"type":"paragraph"},{"id":"LUdnQvLPap","data":{"text":"2002 yılında 41.871 üyesi olan MEMUR-SEN’in üye sayısı 2025’te yaklaşık 25 kat artarak 1.078.831’e çıktı. 2002’de 329.065 kişiyle en fazla üyeye sahip olan TÜRKİYE KAMU-SEN’in üye sayısıysa bu süreçte yaklaşık 1,6 kat artarak 560.060'a yükseldi. Aynı dönemde TÜRKİYE KAMU-SEN’den sonra en fazla üyeye sahip olan ve 2002’de toplam sendikalı sayısının yüzde 40’ını barındıran KESK’in üye sayısıysa yirmi yıl içinde 166.266’ya geriledi. 2002’den bu yana MEMUR-SEN’in kayda değer yükselişi dikkat çekiyor.\u0026nbsp;"},"type":"paragraph"},{"id":"cj7ly2PKIX","data":{"text":"MEMUR-SEN’in birçok uluslararası kuruluş tarafından iktidar partisiyle ilişkisinin sorgulanması kamu personelleri arasındaki sendikalaşmanın siyasi boyutu açısından sağlıklı bir devlet-çalışan ilişkisinin kurulamadığının önemli göstergelerinden biri. Bu ilişkinin en önemli yansıması son yirmi yıllık süreçte artan üye sayısı ve gücü. Bunun yanında kamu görevlilerinin toplu pazarlık yapma hakkına sahipken grev hakkından mahrum olmaları, rutin haline gelen sendikal hak ihlalleri ve sendikaların mali bağımsızlığı ile ilgili sorunlar kamu personellerinin çalışma hakları konusunda olumlu bir atmosfer sunmuyor.\u0026nbsp;"},"type":"paragraph"},{"id":"AOsnjVS2Aw","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/18598538/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/18598538/?utm_source=embed\u0026utm_campaign=visualisation/18598538'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/18598538/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e\u003cdiv style='width:100%!;margin-top:4px!important;text-align:right!important;'\u003e\u003ca class='flourish-credit' href='https://public.flourish.studio/visualisation/18598538/?utm_source=embed\u0026utm_campaign=visualisation/18598538' target='_top' style='text-decoration:none!important'\u003e\u003cimg alt='Made with Flourish' src='https://public.flourish.studio/resources/made_with_flourish.svg' style='width:105px!important;height:16px!important;border:none!important;margin:0!important;'\u003e \u003c/a\u003e\u003c/div\u003e"},"type":"customEmbed"},{"id":"XiwcXRJSH6","data":{"text":"Liyakat ve Yolsuzluk Algı Endeksi","level":3},"type":"header"},{"id":"5U2lb-xJUH","data":{"text":"Türkiye’de kamu istihdamının birçok farklı çevre tarafından tartışılmasının temel sebeplerinden biri de liyakat meselesi. Liyakat, bir kişinin görevini etkili bir şekilde yerine getirebilme yeteneği ve deneyimine dayanırken, özellikle son yıllarda kamu görevlendirme süreçlerinde atanmaların siyasi kriterlere veya akrabalık ilişkilerine dayandığına; eğitim, sağlık ve adalet gibi kritik alanlarda yapılan atamalarda liyakat kavramının ikinci plana atıldığına dair haberler sıkça medyada yer alıyor. Bu çerçevede kamuda mülakatın kaldırılacağına dair vaatler de 28. Dönem Cumhurbaşkanlığı ve Milletvekili Genel Seçimi sürecinde oldukça fazla \u003ca href=\"https://twitter.com/RTErdogan/status/1645803641335607297\"\u003ekonuşulmuştu.\u003c/a\u003e Devlet kadrolarına kimlerin, hangi usulle atandığına, neye göre seçildiğine dair toplum değerlendirmesindeki belirsizlik liyakat konusunu gündeme getirirken, kamu istihdamını da tartışmaya açmakta.\u0026nbsp;"},"type":"paragraph"},{"id":"8ekL1m_BAf","data":{"file":{"url":"https://www.dogrulukpayi.com/images/article/turkiye-de-memur-sayisi-fazla-mi/turkiye-de-memur-sayisi-fazla-mi-0-294.jpg"},"webp":null,"width":1440,"height":1320,"caption":"","mediaId":26221,"blurData":"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAGAAYDASIAAhEBAxEB/8QAFQABAQAAAAAAAAAAAAAAAAAAAAf/xAAcEAACAgMBAQAAAAAAAAAAAAABAgADBAUREjH/xAAVAQEBAAAAAAAAAAAAAAAAAAACA//EABcRAQADAAAAAAAAAAAAAAAAAAEAAhH/2gAMAwEAAhEDEQA/ALnhaNE2ibYVY5ubHOOlthe1wnpSRxj5HSoJP0kCIiCoZKXXZ//Z","rendered":false,"dataOrder":0,"direction":false,"changeImage":false,"withBackground":false},"type":"image"},{"id":"h7u0_FgkaT","data":{"text":"Liyakat konusunun yanı sıra Türkiye’nin \u003ca href=\"https://www.transparency.org/en/cpi/2024\"\u003eYolsuzluk Algı Endeksi’\u003c/a\u003endeki durumu da dikkat çekici. Uluslararası Şeffaflık Derneği, her yıl kamu sektöründe ve politik alanda yolsuzluk algısının ne kadar yaygın olduğunu belirlemek amacıyla dünya genelinde 180’den fazla ülke ve bölgeyi değerlendiren “Yolsuzluk Algı Endeksi” yayımlıyor. Endekste her ülkeye 0 ile 100 arasında bir puan veriliyor. 0 puan en yüksek yolsuzluk algısını (en kötü durumu) ve 100 puan hiç yolsuzluk algısı olmadığını (en iyi durumu) temsil ediyor. Yüksek puan alan ülkeler, toplumda yolsuzluğun daha az algılandığı ve daha şeffaf bir yönetim anlayışının olduğu ülkeler olarak değerlendirilirken, düşük puan alan ülkelerde ise yolsuzluk algısının yaygın olduğu düşünülüyor. Türkiye 2024 yılı Yolsuzluk Algı Endeksi’nde 34 puanla 180 ülke arasından 115. sırada yer aldı. Bir önceki yılla aynı puanda kalan Türkiye, diğer ülkelerin puan değişimi sebebiyle sıralamada 8 sıra yükseldi.\u0026nbsp;"},"type":"paragraph"}],"version":"2.22.2"},"references":[{"url":"https://t24.com.tr/haber/rahmi-koc-200-milletvekiliyle-bu-devlet-rahat-doner,1139893","text":"T24 - Rahmi Koç: 200 milletvekiliyle bu devlet rahat döner"},{"url":"https://www.sbb.gov.tr/kamu-istihdami/","text":"Türkiye Cumhuriyeti Strateji ve Bütçe Başkanlığı - Kamu İstihdamı"},{"url":"https://data.tuik.gov.tr/Bulten/Index?p=Isgucu-Istatistikleri-I.-Ceyrek:-Ocak-Mart,-2024-53517","text":"TÜİK - İşgücü İstatistikleri, I. Çeyrek: Ocak-Mart, 2024"},{"url":"https://www.oecd.org/en/publications/2023/06/government-at-a-glance-2023_da193b0d.html","text":"OECD - Government at a Glance 2023"},{"url":"https: e yaptığı \"Devlette 5,5 milyon kişi çalışıyor. Dolayıs","datePublished":"2024-07-03T14:57:47+03:00","dateModified":"2026-02-11T12:40:58+03:00","author":[{"@type":"Person","name":"Murat İltir","image":"https://www.dogrulukpayi.com/images/user/murat-iltir-140.jpg","url":"https://www.dogrulukpayi.comhttps://www.dogrulukpayi.com/ekibimiz/murat-iltir","sameAs":["https://www.linkedin.com/in/muratiltir/","https://www.twitter.com/muratiltir","https://www.instagram.com/muratiltir"]},{"@type":"Person","name":"Eylül Büyüktunca","image":"https://www.dogrulukpayi.com/images/user/eylul-buyuktunca-135.jpg","url":"https://www.dogrulukpayi.comhttps://www.dogrulukpayi.com/ekibimiz/eylul-buyuktunca"}],"publisher":{"@type":"Organization","logo":{"@type":"ImageObject","url":"https://www.dogrulukpayi.com/build/front-end/img/website_logo@2x.png","width":800,"height":500},"name":"Doğruluk Payı"},"keywords":"istihdam,Kamu İstihdamı,Memur,Memur Sayısı,kamu çalışanı,kamu çalışanı sayısı,türkiye'de memur sayısı"},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Bülten","item":"https://www.dogrulukpayi.com/bultenler"}]}]}]},"duration":5,"contentBlocks":{"time":1770802857853,"blocks":[{"id":"s179FRBvTL","data":{"text":"\u003cbr\u003eTürkiye’de kamuda çalışan kişi sayısı, 2026’da da ekonomik dalgalanmalar ve gelir adaletsizliği tartışmalarıyla birlikte yeniden gündemde. Sosyal medyada bu tartışma çoğunlukla, asgari ücrete sınırlı zam yapılması ve enflasyon karşısında alım gücü düşen özel sektör çalışanları ile, yıl içinde enflasyon farkı ve toplu sözleşmelerle maaş artışı alan kamu çalışanlarının karşılaştırılması üzerinden yürütülüyor. Bu durum, kamu istihdamının görece güvenceli yapısının, artan hayat pahalılığı koşullarında daha fazla sorgulanmasına yol açıyor. Ancak mesele yalnızca maaş artışlarıyla sınırlı değil. Tartışmanın bir diğer konusu kamu kesiminde çalışma rejimindeki sağlıksız yapı ve artan yolsuzluk algısıyla ilgili."},"type":"paragraph"},{"id":"ejmIsfRDHJ","data":{"text":"Bu yüzden “Türkiye’de memur sayısı fazla mı?” sorusuna verilecek bir cevapta olgular kadar yapısal sorunlardan kaynaklı algılara da yer vermek gerek.\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e"},"type":"paragraph"},{"id":"eY-kD8WPwf","data":{"text":"2025 IV. Çeyrekte Kamu İstihdamının Toplam İstihdama Oranı Yüzde 16,3","level":3},"type":"header"},{"id":"RPgTyX8nKf","data":{"text":"Türkiye Cumhuriyeti Cumhurbaşkanlığı Strateji ve Bütçe Başkanlığı’nın 2025 4. Çeyrek verilerine göre, Aralık 2025 itibarıyla toplam kamu personel sayısı 5.342.254 kişi. Bu kamu personeli sayısının %65,5’ini kadrolu, %8,6’sını ise sözleşmeli personeller oluşturuyor. Yaklaşık 1,3 milyon kamu işçisi ise toplam kamu personeli sayısının %24’üne tekabül ediyor."},"type":"paragraph"},{"id":"Rbc8yKI2Hv","data":{"text":"TÜİK tarafından açıklanan\u003ca href=\"https://data.tuik.gov.tr/Bulten/Index?p=Isgucu-Istatistikleri-Aralik-2025-57982#:~:text=%C4%B0stihdam%20edilenlerin%20say%C4%B1s%C4%B1%202025%20y%C4%B1l%C4%B1,%31%2C7%20olarak%20ger%C3%A7ekle%C5%9Fti.\"\u003e İşgücü İstatistiklerine\u003c/a\u003e’ne göre Türkiye’de Aralık 2025 itibarıyla istihdamdaki nüfus sayısı 32 milyon 685 bin kişi. Yapılan hesaplama 2025 için Türkiye’deki kamu personeli sayısının toplam istihdamın %16,3’ü olduğunu gösteriyor.\u0026nbsp;"},"type":"paragraph"},{"id":"jzuGfllRGx","data":{"title":"\u003cb\u003e2025, 4. Çeyrek\u003c/b\u003e","caption":"","content":[["\u003cb\u003eToplam\u0026nbsp;\u003c/b\u003e","\u003cb\u003e5.342.254\u003c/b\u003e"],["\u003cb\u003eKadrolu Personel\u003c/b\u003e","\u003cb\u003e3.501.260\u003c/b\u003e"],["\u003cb\u003eSözleşmeli Personel\u003c/b\u003e","\u003cb\u003e462.090\u003c/b\u003e"],["\u003cb\u003eSürekli İşçi\u003c/b\u003e","\u003cb\u003e1.240.647\u003c/b\u003e"],["\u003cb\u003eGeçici İşçi\u0026nbsp;\u003c/b\u003e","\u003cb\u003e40.371\u003c/b\u003e"],["\u003cb\u003eDiğer\u003c/b\u003e","\u003cb\u003e97.886\u003c/b\u003e"]],"withHeadings":false,"withRowHeadings":false},"type":"table"},{"id":"TYlk7ijIDv","data":{"text":"Türkiye’de Kamu Çalışan Oranı OECD Ortalamasının Altında","level":3},"type":"header"},{"id":"B07eN790-U","data":{"text":"Türkiye’deki kamu çalışan oranı OECD ülkeleriyle karşılaştırılabilir. OECD her yıl kamu sektörünün büyüklüğü, kamu çalışanlarının dağılımı ve kamu hizmetlerinin etkinliği gibi konular ele alan, kamu yönetimi ve kamu istihdamı konularında geniş kapsamlı veriler sunan “\u003ca href=\"https://www.oecd.org/en/publications/government-at-a-glance-2025_0efd0bcd-en.html\"\u003eBir Bakışta Hükümet\u003c/a\u003e” adlı raporunu yayımlıyor. 2025 raporunda son veriler OECD’ye üye ülkelerin 2023 yılı kamu çalışan oranı verilerini içeriyor. 2023 verilerine göre toplam istihdam içinde kamu istihdam oranında OECD ortalaması %18,4. 2023 yılı için Türkiye’de bu oran %13 olarak kaydedilmiş ve Türkiye 38 ülke içinde 31. olarak yer almış. Türkiye’nin en güncel verisini dikkate alsak bile kamu çalışan oranında OECD ortalamasının gerisinde olduğu görülebiliyor.\u0026nbsp;"},"type":"paragraph"},{"id":"DKmaDX6ikI","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/18598471/embed?auto=1' width=400 height=1000\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/18598471/?utm_source=embed\u0026amp;utm_campaign=visualisation/18598471'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/18598471/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:1600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e\u003cdiv style='width:100%!;margin-top:4px!important;text-align:right!important;'\u003e\u003ca class='flourish-credit' href='https://public.flourish.studio/visualisation/18598471/?utm_source=embed\u0026amp;utm_campaign=visualisation/18598471' target='_top' style='text-decoration:none!important'\u003e\u003cimg alt='Made with Flourish' src='https://public.flourish.studio/resources/made_with_flourish.svg' style='width:105px!important;height:16px!important;border:none!important;margin:0!important;'\u003e \u003c/a\u003e\u003c/div\u003e","caption":""},"type":"customEmbed"},{"id":"EcWR3-fJwi","data":{"text":"Bu alanda en yüksek oransa İskandinav ülkelerine ait. Toplam istihdam içinde kamu çalışanı oranının en yüksek olduğu ülkeler yüzde 30 ile Norveç, yüzde 28,2 ile İsveç, yüzde 27,3 ile Danimarka ve yüzde 25,2 ile Finlandiya. En düşük oranlara sahip ülkelerse yüzde 4,9 ile Japonya ve yüzde 8,5 ile Şili."},"type":"paragraph"},{"id":"fRyLvqz99z","data":{"text":"OECD’nin verilerinde Avrupa’da Türkiye’nin yüzde 13 oranından daha düşük orana sahip yedi ülke bulunuyor. Yüzde 11.48’lik oranla İsviçre bu alanda Avrupa’da en düşük orana sahip ülke olurken, İsviçre'yi yüzde 11,53’lük oranla İsviçre ve yüzde 12,3’lük oranla Hollanda takip ediyor."},"type":"paragraph"},{"id":"K61iqzuTbK","data":{"text":"Kamu İstihdamında Kadın Oranı Yalnızca Yüzde 33,6","level":3},"type":"header"},{"id":"_k3li6AVfT","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/18598502/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/18598502/?utm_source=embed\u0026amp;utm_campaign=visualisation/18598502'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/18598502/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:1600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e\u003cdiv style='width:100%!;margin-top:4px!important;text-align:right!important;'\u003e\u003ca class='flourish-credit' href='https://public.flourish.studio/visualisation/18598502/?utm_source=embed\u0026amp;utm_campaign=visualisation/18598502' target='_top' style='text-decoration:none!important'\u003e\u003cimg alt='Made with Flourish' src='https://public.flourish.studio/resources/made_with_flourish.svg' style='width:105px!important;height:16px!important;border:none!important;margin:0!important;'\u003e \u003c/a\u003e\u003c/div\u003e","caption":""},"type":"customEmbed"},{"id":"mXuw8knhhk","data":{"text":"OECD verilerinde yer alan kamu sektöründeki cinsiyet ayrımı incelendiğinde OECD üye ülkelerinde kadın istihdamının erkek istihdamından daha fazla olduğu bir eğilim görülüyor. Ancak Türkiye’de durum farklı seyrediyor. TÜİK’in Nisan 2024’e ilişkin İşgücü İstatistiklerine göre \u003ca href=\"https://data.tuik.gov.tr/Bulten/Index?p=Isgucu-Istatistikleri-Nisan-2024-53511\"\u003eistihdam oranı\u003c/a\u003e erkeklerde yüzde 66,9’ken kadınlarda yüzde 32,5 olarak gerçekleşti. OECD verilerine göre de bu durum kamuda da kendini gösteriyor. \u003cbr\u003e\u003cbr\u003eÖrneğin Litvanya'da kamuda çalışanların yüzde 79.3’ü, Portekiz yüzde 75’i, Birleşik Krallık’ta yüzde 54.6’sı, Fransa’da yüzde 62.7’si kadınken Türkiye’de bu oran yüzde 33.7. Bu oranla Türkiye 42 ülke arasında en düşük ikinci orana sahip ülke olarak öne çıkarken, listenin en altında yüzde 32.7'lik oranla Japonya bulunuyor.\u0026nbsp;"},"type":"paragraph"},{"id":"6NC02DMmf9","data":{"text":"Kamu Sendikacılığı: Güçlü mü, Bağımlı mı?","level":3},"type":"header"},{"id":"AS6jBQN7TH","data":{"text":"Çalışma ve Sosyal Güvenlik Bakanlığı tarafından yayınlanan çalışma istatistiklerine göre 2024’te Türkiye’de işçiler arasında \u003ca href=\"https://www.csgb.gov.tr/media/95252/bolum-1-calisma-istatistikleri-2023.xlsx\"\u003esendikalaşma oranı\u003c/a\u003e %13,2. Bu oran \u003ca href=\"https://www.csgb.gov.tr/media/95253/bolum-2-kamu-gorevlileri-2023.xlsx\"\u003ekamu görevlilerinde\u003c/a\u003e ise %75,6’ya çıkıyor.\u0026nbsp;"},"type":"paragraph"},{"id":"9kPQ6otHWA","data":{"text":"Türkiye’deki kamu görevlileri özelinde yüksek sendikalaşma oranlarının, kamu görevlilerinin örgütlenme bilincine sahip olduklarını gösterip göstermediğiyse oldukça tartışmalı bir konu. 2001’de kabul edilen 4688 sayılı Kamu Görevlileri Sendikaları Kanunu kamu çalışanlarının sendikalaşma ve toplu görüşme süreçlerini düzenleyen ilk özel yasa olurken, bu yasayla kamu görevlilerinin sendikal hakları yasal bir çerçeveye oturtuldu.\u0026nbsp; Bu kanunla\u0026nbsp; kamu çalışanlarının sendikalaşma hakkı detaylandırıldı ve toplu görüşme sürecini tanımlandı. En çok üyeye sahip sendikalar toplu görüşmelerde avantajlı hale getirildi.\u0026nbsp;"},"type":"paragraph"},{"id":"0xlknJ4Gom","data":{"text":"2010 yılında yapılan anayasa değişikliğiyle ise Anayasa'nın 53. maddesi yeniden düzenlendi ve kamu görevlilerine toplu sözleşme hakkı tanındı. Ancak bu hak, grevi içermeyen zorunlu tahkim mekanizması ile sınırlandırıldı."},"type":"paragraph"},{"id":"t1TJwj4pFJ","data":{"text":"Kamu sendikacılığında 21. yüzyıl Türkiye’sinde bu değişimler yaşanırken sendikalı üye sayısında da kayda değer bir artış yaşandı. 2 Temmuz 2002 tarihli \u003ca href=\"https://www.csgb.gov.tr/media/1673/2002_uyesayilari.pdf\"\u003eResmi Gazete\u003c/a\u003e’de 650 bin 770 kişi olarak belirtilen sendikalı kamu emekçisi sayısı, 2026 yılındaki\u003ca href=\"https://www.csgb.gov.tr/%C4%B1statistikler/calisma-hayati-%C4%B1statistikleri/sendikal-%C4%B1statistikler/isci-sayilari-ve-sendikalarin-uye-sayilari-hakkinda-tebligler/\"\u003e resmi verilere göre \u003c/a\u003eyaklaşık 2,5 milyon. Açıklanan resmi verilerde emekçilerin üye olduğu konfederasyonlar da ayrıca dikkat çekiyor.\u0026nbsp;"},"type":"paragraph"},{"id":"LUdnQvLPap","data":{"text":"2002 yılında 41.871 üyesi olan MEMUR-SEN’in üye sayısı 2025’te yaklaşık 25 kat artarak 1.078.831’e çıktı. 2002’de 329.065 kişiyle en fazla üyeye sahip olan TÜRKİYE KAMU-SEN’in üye sayısıysa bu süreçte yaklaşık 1,6 kat artarak 560.060'a yükseldi. Aynı dönemde TÜRKİYE KAMU-SEN’den sonra en fazla üyeye sahip olan ve 2002’de toplam sendikalı sayısının yüzde 40’ını barındıran KESK’in üye sayısıysa yirmi yıl içinde 166.266’ya geriledi. 2002’den bu yana MEMUR-SEN’in kayda değer yükselişi dikkat çekiyor.\u0026nbsp;"},"type":"paragraph"},{"id":"cj7ly2PKIX","data":{"text":"MEMUR-SEN’in birçok uluslararası kuruluş tarafından iktidar partisiyle ilişkisinin sorgulanması kamu personelleri arasındaki sendikalaşmanın siyasi boyutu açısından sağlıklı bir devlet-çalışan ilişkisinin kurulamadığının önemli göstergelerinden biri. Bu ilişkinin en önemli yansıması son yirmi yıllık süreçte artan üye sayısı ve gücü. Bunun yanında kamu görevlilerinin toplu pazarlık yapma hakkına sahipken grev hakkından mahrum olmaları, rutin haline gelen sendikal hak ihlalleri ve sendikaların mali bağımsızlığı ile ilgili sorunlar kamu personellerinin çalışma hakları konusunda olumlu bir atmosfer sunmuyor.\u0026nbsp;"},"type":"paragraph"},{"id":"AOsnjVS2Aw","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/18598538/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/18598538/?utm_source=embed\u0026utm_campaign=visualisation/18598538'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/18598538/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e\u003cdiv style='width:100%!;margin-top:4px!important;text-align:right!important;'\u003e\u003ca class='flourish-credit' href='https://public.flourish.studio/visualisation/18598538/?utm_source=embed\u0026utm_campaign=visualisation/18598538' target='_top' style='text-decoration:none!important'\u003e\u003cimg alt='Made with Flourish' src='https://public.flourish.studio/resources/made_with_flourish.svg' style='width:105px!important;height:16px!important;border:none!important;margin:0!important;'\u003e \u003c/a\u003e\u003c/div\u003e"},"type":"customEmbed"},{"id":"XiwcXRJSH6","data":{"text":"Liyakat ve Yolsuzluk Algı Endeksi","level":3},"type":"header"},{"id":"5U2lb-xJUH","data":{"text":"Türkiye’de kamu istihdamının birçok farklı çevre tarafından tartışılmasının temel sebeplerinden biri de liyakat meselesi. Liyakat, bir kişinin görevini etkili bir şekilde yerine getirebilme yeteneği ve deneyimine dayanırken, özellikle son yıllarda kamu görevlendirme süreçlerinde atanmaların siyasi kriterlere veya akrabalık ilişkilerine dayandığına; eğitim, sağlık ve adalet gibi kritik alanlarda yapılan atamalarda liyakat kavramının ikinci plana atıldığına dair haberler sıkça medyada yer alıyor. Bu çerçevede kamuda mülakatın kaldırılacağına dair vaatler de 28. Dönem Cumhurbaşkanlığı ve Milletvekili Genel Seçimi sürecinde oldukça fazla \u003ca href=\"https://twitter.com/RTErdogan/status/1645803641335607297\"\u003ekonuşulmuştu.\u003c/a\u003e Devlet kadrolarına kimlerin, hangi usulle atandığına, neye göre seçildiğine dair toplum değerlendirmesindeki belirsizlik liyakat konusunu gündeme getirirken, kamu istihdamını da tartışmaya açmakta.\u0026nbsp;"},"type":"paragraph"},{"id":"8ekL1m_BAf","data":{"file":{"url":"https://www.dogrulukpayi.com/images/article/turkiye-de-memur-sayisi-fazla-mi/turkiye-de-memur-sayisi-fazla-mi-0-294.jpg"},"webp":null,"width":1440,"height":1320,"caption":"","mediaId":26221,"blurData":"data:image/jpeg;base64,/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAGAAYDASIAAhEBAxEB/8QAFQABAQAAAAAAAAAAAAAAAAAAAAf/xAAcEAACAgMBAQAAAAAAAAAAAAABAgADBAUREjH/xAAVAQEBAAAAAAAAAAAAAAAAAAACA//EABcRAQADAAAAAAAAAAAAAAAAAAEAAhH/2gAMAwEAAhEDEQA/ALnhaNE2ibYVY5ubHOOlthe1wnpSRxj5HSoJP0kCIiCoZKXXZ//Z","rendered":false,"dataOrder":0,"direction":false,"changeImage":false,"withBackground":false},"type":"image"},{"id":"h7u0_FgkaT","data":{"text":"Liyakat konusunun yanı sıra Türkiye’nin \u003ca href=\"https://www.transparency.org/en/cpi/2024\"\u003eYolsuzluk Algı Endeksi’\u003c/a\u003endeki durumu da dikkat çekici. Uluslararası Şeffaflık Derneği, her yıl kamu sektöründe ve politik alanda yolsuzluk algısının ne kadar yaygın olduğunu belirlemek amacıyla dünya genelinde 180’den fazla ülke ve bölgeyi değerlendiren “Yolsuzluk Algı Endeksi” yayımlıyor. Endekste her ülkeye 0 ile 100 arasında bir puan veriliyor. 0 puan en yüksek yolsuzluk algısını (en kötü durumu) ve 100 puan hiç yolsuzluk algısı olmadığını (en iyi durumu) temsil ediyor. Yüksek puan alan ülkeler, toplumda yolsuzluğun daha az algılandığı ve daha şeffaf bir yönetim anlayışının olduğu ülkeler olarak değerlendirilirken, düşük puan alan ülkelerde ise yolsuzluk algısının yaygın olduğu düşünülüyor. Türkiye 2024 yılı Yolsuzluk Algı Endeksi’nde 34 puanla 180 ülke arasından 115. sırada yer aldı. Bir önceki yılla aynı puanda kalan Türkiye, diğer ülkelerin puan değişimi sebebiyle sıralamada 8 sıra yükseldi.\u0026nbsp;"},"type":"paragraph"}],"version":"2.22.2"},"references":[{"url":"https://t24.com.tr/haber/rahmi-koc-200-milletvekiliyle-bu-devlet-rahat-doner,1139893","text":"T24 - Rahmi Koç: 200 milletvekiliyle bu devlet rahat döner"},{"url":"https://www.sbb.gov.tr/kamu-istihdami/","text":"Türkiye Cumhuriyeti Strateji ve Bütçe Başkanlığı - Kamu İstihdamı"},{"url":"https://data.tuik.gov.tr/Bulten/Index?p=Isgucu-Istatistikleri-I.-Ceyrek:-Ocak-Mart,-2024-53517","text":"TÜİK - İşgücü İstatistikleri, I. Çeyrek: Ocak-Mart, 2024"},{"url":"https://www.oecd.org/en/pub
