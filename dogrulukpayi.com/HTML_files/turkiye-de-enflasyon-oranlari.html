ct","url":"https://www.dogrulukpayi.com/build/front-end/img/website_logo@2x.png","width":800,"height":500},"name":"Doğruluk Payı","@id":"#Publisher","address":{"@type":"PostalAddress","addressCountry":"Turkey","addressLocality":"Istanbul"},"description":"Doğruluk Payı'nın videolu analizlerine bu bölümden erişebilirsiniz.","foundingDate":2014,"legalName":"İzlemedeyiz Derneği","sameAs":["https://twitter.com/dogrulukpayicom","https://www.facebook.com/dogrulukpayi/","https://www.instagram.com/dogrulukpayi/","https://www.youtube.com/c/Dogrulukpayicom","https://tr.linkedin.com/company/dogrulukpayi","https://eksisozluk.com/biri/dogrulukpayi"],"url":"https://dogrulukpayi.com"},{"@type":"Article","speakable":{"@type":"SpeakableSpecification","xpath":["/html/head/title","/html/head/meta[@name='description']/@content"]},"thumbnailUrl":"https://www.dogrulukpayi.com/images/article/turkiye-de-enflasyon-oranlari-37.jpg","image":{"@type":"ImageObject","url":"https://www.dogrulukpayi.com/images/article/turkiye-de-enflasyon-oranlari-37.jpg","width":1440,"height":1222},"mainEntityOfPage":"https://www.dogrulukpayi.com/bulten/turkiye-de-enflasyon-oranlari","headline":"Türkiye'de Enflasyon Oranları","description":"COVID-19 salgını, bu salgına dair alınan önlemler, artan işsizlik ve yükselen döviz kurlarıyla beraber Türkiye’nin son zamanlarda en önemli gündemlerinden biri de tüketici fiyatları. Özellikle 2018 yılının 2. yarısında makroekonomik göstergelerdeki negatif seyir neticesinde ciddi bir artış gösteren","datePublished":"2020-07-03T15:02:41+03:00","dateModified":"2026-01-29T15:30:24+03:00","author":[{"@type":"Person","name":"Resul Kunt","image":"https://www.dogrulukpayi.com/images/user/resul-kunt.jpg","url":"https://www.dogrulukpayi.comhttps://www.dogrulukpayi.com/ekibimiz/resul-kunt"}],"publisher":{"@type":"Organization","logo":{"@type":"ImageObject","url":"https://www.dogrulukpayi.com/build/front-end/img/website_logo@2x.png","width":800,"height":500},"name":"Doğruluk Payı"},"keywords":"işsizlik,enflasyon,artış,TÜFE,Dolar Kuru,Fiyat,Gıda,Ürün,GSYH,usd,Politika Faizi,Ağustos,Fiyat Artışı,deflasyon"},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Bülten","item":"https://www.dogrulukpayi.com/bultenler"}]}]}]},"duration":8,"contentBlocks":{"time":1769689824149,"blocks":[{"id":"HAz_yc_XxI","data":{"text":"Bir ülke ekonomisinin gidişatını anlamak için tek bir veriye bakmak çoğu zaman yanıltıcıdır. Ekonomik tablo, fiyatların nasıl değiştiğinden üretimin ne kadar arttığına, insanların iş bulup bulamadığından paranın maliyetine, dövizin seyrinden dış dünyayla kurulan ekonomik ilişkilere kadar birbiriyle bağlantılı birçok göstergenin birlikte değerlendirilmesini gerektirir. Bu göstergeler, ekonominin sadece ne kadar büyüdüğünü değil, bu büyümenin toplumun farklı kesimlerine nasıl yansıdığını, ne kadar sürdürülebilir olduğunu ve hangi riskleri barındırdığını da ortaya koyar. Enflasyon, büyüme, işsizlik, faiz, döviz kuru ve cari denge gibi temel değişkenler bir arada ele alındığında, bir ekonominin istikrarı, kırılganlıkları ve geleceğe dair yönü hakkında daha bütünlüklü ve sağlıklı bir değerlendirme yapmak mümkün hale gelir."},"type":"paragraph"},{"id":"W8TbbQJKTJ","data":{"text":"Tüketici Fiyat Endeksi ve Enflasyon","level":3},"type":"header"},{"id":"TeMEE-CPTE","data":{"text":"Mal ve hizmet fiyatlarındaki artış belli bir referans dönemindeki değişimi gösteren enflasyon bir ekonominin istikrarını ve sağlığını gösteren en önemli göstergelerden biri. Enflasyon, temelde bir para biriminin değerinde zamanla meydana gelen aşınmayı nicel bir şekilde ölçer. Ülke vatandaşlarının satın alma gücünü belirleyen en başat göstergedir.\u0026nbsp;"},"type":"paragraph"},{"id":"JzYna4BSGG","data":{"text":"Türkiye İstatistik Kurumu (TÜİK) her ayın ilk haftasında üretici ve tüketici fiyat endeksinde bir ay içinde meydana gelen değişimi kamuya açıklar. Birçok ekonomik aktör için bu iki endeksteki değişim ekonominin genel durumu için en temel bilgileri verir. Fakat çok bilinmese de TÜİK bu iki endeks dışında ay boyunca dört farklı kategoride endeks sonuçlarını da bu genel tabloya ekler. Dolayısıyla TÜİK'in takip ettiği 6 farklı fiyat endeksi vardır."},"type":"paragraph"},{"id":"7z3--S2w0T","data":{"title":"Fiyat Endeksleri","caption":"","content":[["Endeksler","Hangi Fiyatları Takip Ediyor?"],["Tüketici Fiyat Endeksi (TÜFE)","Hanehalklarının tüketimine yönelik mal ve hizmet fiyatları"],["Yurt İçi Üretici Fiyat Endeksi (Yİ-ÜFE)","Ülke ekonomisinde üretimi yapılan ve yurt içine satışa konu olan ürünlerin üretici fiyatları"],["Yurt Dışı Üretici Fiyat Endeksi (Yİ-ÜFE)","Ülke ekonomisinde üretimi yapılan ve yurt dışına satışa konu olan ürünlerin üretici fiyatları"],["Tarım Ürünleri Üretici Fiyat Endeksi (Tarım-ÜFE)","Çiftçinin üreterek piyasaya satışını yaptığı ürünlerin ilk el satış fiyatları"],["Tarımsal Girdi Fiyat Endeksi (Tarım-GFE)","Çiftçinin tarımsal faaliyetlerini gerçekleştirmek için gerek cari üretim yıllarında gerekse yatırım amaçlı satın aldığı girdi fiyatları"],["Hizmet Üretici Fiyat Endeksi (H-ÜFE)","Ülke ekonomisinde üretimi yapılan hizmetlerin üretici fiyatları"]],"withHeadings":false,"withRowHeadings":false},"type":"table"},{"id":"HocV4pIktY","data":{"text":"Fiyat seviyesi ve ağırlık bilgisi üzerinden oluşturulan Tüketici Fiyat Endeksi, enflasyon hesaplamaları için temeli oluşturur."},"type":"paragraph"},{"id":"I5wX0jiemy","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/18711472/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/18711472/?utm_source=embed\u0026amp;utm_campaign=visualisation/18711472'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/18711472/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e"},"type":"customEmbed"},{"id":"EsrWaUalGM","data":{"text":"Ekonomik Büyüme","level":3},"type":"header"},{"id":"iy9qdOu71r","data":{"text":"Ekonomik büyüme, bir ülkede belirli bir dönemde üretilen mal ve hizmetlerin toplam değerindeki artışı ifade eder. Bu gösterge genellikle Gayrisafi Yurt İçi Hasıla (GSYH) üzerinden ölçülür. Türkiye’de büyüme verileri, üçer aylık dönemler halinde açıklanır ve hem cari fiyatlarla hem de enflasyondan arındırılmış reel büyüme oranlarıyla takip edilir. Reel büyüme, fiyat artışlarının etkisini dışarıda bıraktığı için ekonomideki gerçek genişlemeyi görmeyi sağlar."},"type":"paragraph"},{"id":"X1XN5XOoLc","data":{"text":"Büyüme oranı, ekonominin genel sağlığına dair en temel göstergelerden biridir. Yüksek büyüme, üretim kapasitesinin arttığına ve ekonomik faaliyetlerin canlandığına işaret ederken düşük ya da negatif büyüme, durgunluk ve daralma risklerini gündeme getirir. Ancak büyümenin niteliği de en az büyüklüğü kadar önemlidir. Yatırım ve ihracat kaynaklı bir büyüme ile kredi ve tüketime dayalı bir büyüme, orta ve uzun vadede çok farklı sonuçlar üretir. Yatırım ve ihracat kaynaklı büyüme görece yavaş ama krizlere karşı daha dirençliyken, kredi ve tüketime dayalı büyüme ise hızlı olmasına rağmen borçlanma sarmalına ve krizlere karşı kırılganlığa neden olur."},"type":"paragraph"},{"id":"VemMMU4XY4","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/27425784/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/27425784/?utm_source=embed\u0026amp;utm_campaign=visualisation/27425784'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/27425784/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e"},"type":"customEmbed"},{"id":"leoc7DvAcS","data":{"text":"İşsizlik Oranı","level":3},"type":"header"},{"id":"KB9dL1tcng","data":{"text":"İşsizlik oranı, çalışma çağındaki nüfus içinde işsiz olanların toplam işgücüne oranını gösterir. Türkiye’de bu veri, TÜİK tarafından Hanehalkı İşgücü Araştırması üzerinden hesaplanır. İşsiz sayılabilmek için kişinin son dört hafta içinde aktif olarak iş aramış olması ve çalışmaya hazır durumda bulunması gerekir. Bu nedenle işsizlik oranı, yalnızca işsizliği değil, işgücüne katılım dinamiklerini de yansıtır."},"type":"paragraph"},{"id":"TPraJtvWRW","data":{"text":"İşsizlik oranı, büyümenin topluma nasıl yansıdığını gösteren en kritik göstergelerden biridir. Ekonomi büyürken işsizlik düşmüyorsa, bu durum büyümenin istihdam yaratmadığına işaret eder. Özellikle genç işsizliği ve kadın işsizliği gibi alt kırılımlar, ekonomik ve sosyal risklerin erken sinyallerini verir. Uzun süreli yüksek işsizlik, gelir dağılımı bozulması ve yoksulluk riskini de beraberinde getirir."},"type":"paragraph"},{"id":"QTWZyBJdGe","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/18714291/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/18714291/?utm_source=embed\u0026amp;utm_campaign=visualisation/18714291'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/18714291/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e"},"type":"customEmbed"},{"id":"6CEailjuh3","data":{"text":"Politika Faizi","level":3},"type":"header"},{"id":"iYJ6uxINar","data":{"text":"Politika faizi, merkez bankasının para politikasını yönlendirmek için kullandığı temel faiz oranıdır. Türkiye’de bu oran, Merkez Bankası’nın bankalara uyguladığı bir haftalık repo ihale faizi üzerinden tanımlanır. Politika faizi, piyasadaki diğer faiz oranları için bir referans noktası oluşturur ve para politikasının sıkı ya da gevşek olup olmadığını gösterir."},"type":"paragraph"},{"id":"yldbCDxg8G","data":{"text":"Politika faizi, enflasyonla mücadelede ve finansal istikrarın sağlanmasında kilit bir araçtır. Faiz artışları, kredi maliyetlerini yükselterek talebi sınırlamayı; faiz indirimleri ise ekonomik aktiviteyi canlandırmayı hedefler. Aynı zamanda döviz kuru, sermaye hareketleri ve beklentiler üzerinde de doğrudan etkisi vardır. Bu nedenle politika faizi, sadece teknik bir oran değil, ekonomi yönetiminin genel yönelimini gösteren güçlü bir sinyal olarak izlenir."},"type":"paragraph"},{"id":"iZ3wDxy5nV","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/27409286/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/27409286/?utm_source=embed\u0026amp;utm_campaign=visualisation/27409286'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/27409286/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e"},"type":"customEmbed"},{"id":"KAoWYfoZDs","data":{"text":"Döviz Kuru","level":3},"type":"header"},{"id":"tBdx59pr75","data":{"text":"Döviz kuru, yerli paranın yabancı paralar karşısındaki değerini gösterir. Türkiye’de en çok takip edilen kur, ABD doları (USD) karşısındaki TL değeridir. Kur seviyesi ve kurdaki değişim, piyasada oluşan arz-talep dengesiyle belirlenir. Merkez Bankası’nın yayımladığı gösterge niteliğindeki kurlar ve bankalararası piyasa verileri bu alanda temel referans kabul edilir."},"type":"paragraph"},{"id":"puVpznK8EK","data":{"text":"USD/TL kuru, Türkiye ekonomisi için özellikle kritik bir göstergedir çünkü ithalat, dış borç ve enerji maliyetleri büyük ölçüde dövize bağlıdır. Kur artışları, maliyet kanalı üzerinden enflasyonu beslerken; kurdaki oynaklık, şirketlerin ve hanehalklarının ekonomik öngörülerini zorlaştırır. Aynı zamanda kur seviyesi, yabancı yatırımcı algısı ve sermaye giriş-çıkışları hakkında da güçlü ipuçları sunar."},"type":"paragraph"},{"id":"W1hucMBB4t","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/27409368/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/27409368/?utm_source=embed\u0026amp;utm_campaign=visualisation/27409368'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/27409368/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e"},"type":"customEmbed"},{"id":"GWlyX7Gs_1","data":{"text":"Cari Denge","level":3},"type":"header"},{"id":"luy003cpIj","data":{"text":"Cari denge, bir ülkenin dış dünyayla yaptığı mal ve hizmet ticareti, gelir transferleri ve yatırımların toplam sonucunu gösterir. Cari açık ya da fazla olarak ifade edilen bu gösterge, aylık ve yıllık kümülatif veriler üzerinden izlenir. Bir ülkenin dünyadan kazandığı döviz harcadığı dövizden yüksekse cari fazla, düşükse cari açık oluşur. Türkiye’de cari denge dış ticaret dengesi ve hizmetler dengesi gibi birincil ve ikincil gelir kalemlerinden oluşur."},"type":"paragraph"},{"id":"tBYR3U7j2z","data":{"text":"Cari denge, bir ekonominin dış finansmana ne kadar ihtiyaç duyduğunu gösterir. Sürekli cari açık veren ülkeler, bu açığı finanse edebilmek için borçlanmaya ya da sermaye girişlerine bağımlı hale gelir. Bu durum, küresel koşullar değiştiğinde kırılganlık yaratır. Cari açığın azalması ya da fazla verilmesi ise döviz ihtiyacının düşmesi ve makroekonomik dayanıklılığın artması anlamına gelir."},"type":"paragraph"},{"id":"21AGtkmlh_","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/27425869/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/27425869/?utm_source=embed\u0026amp;utm_campaign=visualisation/27425869'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/27425869/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e","caption":""},"type":"customEmbed"},{"id":"xSe7FxIl9B","data":{"text":"Bu içerik Doğruluk Payı editörleri tarafından her ay güncellenmektedir.","caption":"","alignment":"left"},"type":"quote"}],"version":"2.22.2"},"references":[{"url":"https://data.tuik.gov.tr/Bulten/Index?p=%C4%B0%C5%9Fg%C3%BCc%C3%BC-%C4%B0statistikleri-Kas%C4%B1m-2025-54068\u0026dil=1","text":"TÜİK - İşgücü İstatistikleri, Aralık 2025"},{"url":"https://data.tuik. "height":500},"name":"Doğruluk Payı","@id":"#Publisher","address":{"@type":"PostalAddress","addressCountry":"Turkey","addressLocality":"Istanbul"},"description":"Doğruluk Payı'nın videolu analizlerine bu bölümden erişebilirsiniz.","foundingDate":2014,"legalName":"İzlemedeyiz Derneği","sameAs":["https://twitter.com/dogrulukpayicom","https://www.facebook.com/dogrulukpayi/","https://www.instagram.com/dogrulukpayi/","https://www.youtube.com/c/Dogrulukpayicom","https://tr.linkedin.com/company/dogrulukpayi","https://eksisozluk.com/biri/dogrulukpayi"],"url":"https://dogrulukpayi.com"},{"@type":"Article","speakable":{"@type":"SpeakableSpecification","xpath":["/html/head/title","/html/head/meta[@name='description']/@content"]},"thumbnailUrl":"https://www.dogrulukpayi.com/images/article/turkiye-de-enflasyon-oranlari-37.jpg","image":{"@type":"ImageObject","url":"https://www.dogrulukpayi.com/images/article/turkiye-de-enflasyon-oranlari-37.jpg","width":1440,"height":1222},"mainEntityOfPage":"https://www.dogrulukpayi.com/bulten/turkiye-de-enflasyon-oranlari","headline":"Türkiye'de Enflasyon Oranları","description":"COVID-19 salgını, bu salgına dair alınan önlemler, artan işsizlik ve yükselen döviz kurlarıyla beraber Türkiye’nin son zamanlarda en önemli gündemlerinden biri de tüketici fiyatları. Özellikle 2018 yılının 2. yarısında makroekonomik göstergelerdeki negatif seyir neticesinde ciddi bir artış gösteren","datePublished":"2020-07-03T15:02:41+03:00","dateModified":"2026-01-29T15:30:24+03:00","author":[{"@type":"Person","name":"Resul Kunt","image":"https://www.dogrulukpayi.com/images/user/resul-kunt.jpg","url":"https://www.dogrulukpayi.comhttps://www.dogrulukpayi.com/ekibimiz/resul-kunt"}],"publisher":{"@type":"Organization","logo":{"@type":"ImageObject","url":"https://www.dogrulukpayi.com/build/front-end/img/website_logo@2x.png","width":800,"height":500},"name":"Doğruluk Payı"},"keywords":"işsizlik,enflasyon,artış,TÜFE,Dolar Kuru,Fiyat,Gıda,Ürün,GSYH,usd,Politika Faizi,Ağustos,Fiyat Artışı,deflasyon"},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Bülten","item":"https://www.dogrulukpayi.com/bultenler"}]}]}]},"duration":8,"contentBlocks":{"time":1769689824149,"blocks":[{"id":"HAz_yc_XxI","data":{"text":"Bir ülke ekonomisinin gidişatını anlamak için tek bir veriye bakmak çoğu zaman yanıltıcıdır. Ekonomik tablo, fiyatların nasıl değiştiğinden üretimin ne kadar arttığına, insanların iş bulup bulamadığından paranın maliyetine, dövizin seyrinden dış dünyayla kurulan ekonomik ilişkilere kadar birbiriyle bağlantılı birçok göstergenin birlikte değerlendirilmesini gerektirir. Bu göstergeler, ekonominin sadece ne kadar büyüdüğünü değil, bu büyümenin toplumun farklı kesimlerine nasıl yansıdığını, ne kadar sürdürülebilir olduğunu ve hangi riskleri barındırdığını da ortaya koyar. Enflasyon, büyüme, işsizlik, faiz, döviz kuru ve cari denge gibi temel değişkenler bir arada ele alındığında, bir ekonominin istikrarı, kırılganlıkları ve geleceğe dair yönü hakkında daha bütünlüklü ve sağlıklı bir değerlendirme yapmak mümkün hale gelir."},"type":"paragraph"},{"id":"W8TbbQJKTJ","data":{"text":"Tüketici Fiyat Endeksi ve Enflasyon","level":3},"type":"header"},{"id":"TeMEE-CPTE","data":{"text":"Mal ve hizmet fiyatlarındaki artış belli bir referans dönemindeki değişimi gösteren enflasyon bir ekonominin istikrarını ve sağlığını gösteren en önemli göstergelerden biri. Enflasyon, temelde bir para biriminin değerinde zamanla meydana gelen aşınmayı nicel bir şekilde ölçer. Ülke vatandaşlarının satın alma gücünü belirleyen en başat göstergedir.\u0026nbsp;"},"type":"paragraph"},{"id":"JzYna4BSGG","data":{"text":"Türkiye İstatistik Kurumu (TÜİK) her ayın ilk haftasında üretici ve tüketici fiyat endeksinde bir ay içinde meydana gelen değişimi kamuya açıklar. Birçok ekonomik aktör için bu iki endeksteki değişim ekonominin genel durumu için en temel bilgileri verir. Fakat çok bilinmese de TÜİK bu iki endeks dışında ay boyunca dört farklı kategoride endeks sonuçlarını da bu genel tabloya ekler. Dolayısıyla TÜİK'in takip ettiği 6 farklı fiyat endeksi vardır."},"type":"paragraph"},{"id":"7z3--S2w0T","data":{"title":"Fiyat Endeksleri","caption":"","content":[["Endeksler","Hangi Fiyatları Takip Ediyor?"],["Tüketici Fiyat Endeksi (TÜFE)","Hanehalklarının tüketimine yönelik mal ve hizmet fiyatları"],["Yurt İçi Üretici Fiyat Endeksi (Yİ-ÜFE)","Ülke ekonomisinde üretimi yapılan ve yurt içine satışa konu olan ürünlerin üretici fiyatları"],["Yurt Dışı Üretici Fiyat Endeksi (Yİ-ÜFE)","Ülke ekonomisinde üretimi yapılan ve yurt dışına satışa konu olan ürünlerin üretici fiyatları"],["Tarım Ürünleri Üretici Fiyat Endeksi (Tarım-ÜFE)","Çiftçinin üreterek piyasaya satışını yaptığı ürünlerin ilk el satış fiyatları"],["Tarımsal Girdi Fiyat Endeksi (Tarım-GFE)","Çiftçinin tarımsal faaliyetlerini gerçekleştirmek için gerek cari üretim yıllarında gerekse yatırım amaçlı satın aldığı girdi fiyatları"],["Hizmet Üretici Fiyat Endeksi (H-ÜFE)","Ülke ekonomisinde üretimi yapılan hizmetlerin üretici fiyatları"]],"withHeadings":false,"withRowHeadings":false},"type":"table"},{"id":"HocV4pIktY","data":{"text":"Fiyat seviyesi ve ağırlık bilgisi üzerinden oluşturulan Tüketici Fiyat Endeksi, enflasyon hesaplamaları için temeli oluşturur."},"type":"paragraph"},{"id":"I5wX0jiemy","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/18711472/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/18711472/?utm_source=embed\u0026amp;utm_campaign=visualisation/18711472'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/18711472/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e"},"type":"customEmbed"},{"id":"EsrWaUalGM","data":{"text":"Ekonomik Büyüme","level":3},"type":"header"},{"id":"iy9qdOu71r","data":{"text":"Ekonomik büyüme, bir ülkede belirli bir dönemde üretilen mal ve hizmetlerin toplam değerindeki artışı ifade eder. Bu gösterge genellikle Gayrisafi Yurt İçi Hasıla (GSYH) üzerinden ölçülür. Türkiye’de büyüme verileri, üçer aylık dönemler halinde açıklanır ve hem cari fiyatlarla hem de enflasyondan arındırılmış reel büyüme oranlarıyla takip edilir. Reel büyüme, fiyat artışlarının etkisini dışarıda bıraktığı için ekonomideki gerçek genişlemeyi görmeyi sağlar."},"type":"paragraph"},{"id":"X1XN5XOoLc","data":{"text":"Büyüme oranı, ekonominin genel sağlığına dair en temel göstergelerden biridir. Yüksek büyüme, üretim kapasitesinin arttığına ve ekonomik faaliyetlerin canlandığına işaret ederken düşük ya da negatif büyüme, durgunluk ve daralma risklerini gündeme getirir. Ancak büyümenin niteliği de en az büyüklüğü kadar önemlidir. Yatırım ve ihracat kaynaklı bir büyüme ile kredi ve tüketime dayalı bir büyüme, orta ve uzun vadede çok farklı sonuçlar üretir. Yatırım ve ihracat kaynaklı büyüme görece yavaş ama krizlere karşı daha dirençliyken, kredi ve tüketime dayalı büyüme ise hızlı olmasına rağmen borçlanma sarmalına ve krizlere karşı kırılganlığa neden olur."},"type":"paragraph"},{"id":"VemMMU4XY4","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/27425784/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/27425784/?utm_source=embed\u0026amp;utm_campaign=visualisation/27425784'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/27425784/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e"},"type":"customEmbed"},{"id":"leoc7DvAcS","data":{"text":"İşsizlik Oranı","level":3},"type":"header"},{"id":"KB9dL1tcng","data":{"text":"İşsizlik oranı, çalışma çağındaki nüfus içinde işsiz olanların toplam işgücüne oranını gösterir. Türkiye’de bu veri, TÜİK tarafından Hanehalkı İşgücü Araştırması üzerinden hesaplanır. İşsiz sayılabilmek için kişinin son dört hafta içinde aktif olarak iş aramış olması ve çalışmaya hazır durumda bulunması gerekir. Bu nedenle işsizlik oranı, yalnızca işsizliği değil, işgücüne katılım dinamiklerini de yansıtır."},"type":"paragraph"},{"id":"TPraJtvWRW","data":{"text":"İşsizlik oranı, büyümenin topluma nasıl yansıdığını gösteren en kritik göstergelerden biridir. Ekonomi büyürken işsizlik düşmüyorsa, bu durum büyümenin istihdam yaratmadığına işaret eder. Özellikle genç işsizliği ve kadın işsizliği gibi alt kırılımlar, ekonomik ve sosyal risklerin erken sinyallerini verir. Uzun süreli yüksek işsizlik, gelir dağılımı bozulması ve yoksulluk riskini de beraberinde getirir."},"type":"paragraph"},{"id":"QTWZyBJdGe","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/18714291/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/18714291/?utm_source=embed\u0026amp;utm_campaign=visualisation/18714291'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/18714291/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e"},"type":"customEmbed"},{"id":"6CEailjuh3","data":{"text":"Politika Faizi","level":3},"type":"header"},{"id":"iYJ6uxINar","data":{"text":"Politika faizi, merkez bankasının para politikasını yönlendirmek için kullandığı temel faiz oranıdır. Türkiye’de bu oran, Merkez Bankası’nın bankalara uyguladığı bir haftalık repo ihale faizi üzerinden tanımlanır. Politika faizi, piyasadaki diğer faiz oranları için bir referans noktası oluşturur ve para politikasının sıkı ya da gevşek olup olmadığını gösterir."},"type":"paragraph"},{"id":"yldbCDxg8G","data":{"text":"Politika faizi, enflasyonla mücadelede ve finansal istikrarın sağlanmasında kilit bir araçtır. Faiz artışları, kredi maliyetlerini yükselterek talebi sınırlamayı; faiz indirimleri ise ekonomik aktiviteyi canlandırmayı hedefler. Aynı zamanda döviz kuru, sermaye hareketleri ve beklentiler üzerinde de doğrudan etkisi vardır. Bu nedenle politika faizi, sadece teknik bir oran değil, ekonomi yönetiminin genel yönelimini gösteren güçlü bir sinyal olarak izlenir."},"type":"paragraph"},{"id":"iZ3wDxy5nV","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/27409286/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/27409286/?utm_source=embed\u0026amp;utm_campaign=visualisation/27409286'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/27409286/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e"},"type":"customEmbed"},{"id":"KAoWYfoZDs","data":{"text":"Döviz Kuru","level":3},"type":"header"},{"id":"tBdx59pr75","data":{"text":"Döviz kuru, yerli paranın yabancı paralar karşısındaki değerini gösterir. Türkiye’de en çok takip edilen kur, ABD doları (USD) karşısındaki TL değeridir. Kur seviyesi ve kurdaki değişim, piyasada oluşan arz-talep dengesiyle belirlenir. Merkez Bankası’nın yayımladığı gösterge niteliğindeki kurlar ve bankalararası piyasa verileri bu alanda temel referans kabul edilir."},"type":"paragraph"},{"id":"puVpznK8EK","data":{"text":"USD/TL kuru, Türkiye ekonomisi için özellikle kritik bir göstergedir çünkü ithalat, dış borç ve enerji maliyetleri büyük ölçüde dövize bağlıdır. Kur artışları, maliyet kanalı üzerinden enflasyonu beslerken; kurdaki oynaklık, şirketlerin ve hanehalklarının ekonomik öngörülerini zorlaştırır. Aynı zamanda kur seviyesi, yabancı yatırımcı algısı ve sermaye giriş-çıkışları hakkında da güçlü ipuçları sunar."},"type":"paragraph"},{"id":"W1hucMBB4t","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/27409368/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/27409368/?utm_source=embed\u0026amp;utm_campaign=visualisation/27409368'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/27409368/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e"},"type":"customEmbed"},{"id":"GWlyX7Gs_1","data":{"text":"Cari Denge","level":3},"type":"header"},{"id":"luy003cpIj","data":{"text":"Cari denge, bir ülkenin dış dünyayla yaptığı mal ve hizmet ticareti, gelir transferleri ve yatırımların toplam sonucunu gösterir. Cari açık ya da fazla olarak ifade edilen bu gösterge, aylık ve yıllık kümülatif veriler üzerinden izlenir. Bir ülkenin dünyadan kazandığı döviz harcadığı dövizden yüksekse cari fazla, düşükse cari açık oluşur. Türkiye’de cari denge dış ticaret dengesi ve hizmetler dengesi gibi birincil ve ikincil gelir kalemlerinden oluşur."},"type":"paragraph"},{"id":"tBYR3U7j2z","data":{"text":"Cari denge, bir ekonominin dış finansmana ne kadar ihtiyaç duyduğunu gösterir. Sürekli cari açık veren ülkeler, bu açığı finanse edebilmek için borçlanmaya ya da sermaye girişlerine bağımlı hale gelir. Bu durum, küresel koşullar değiştiğinde kırılganlık yaratır. Cari açığın azalması ya da fazla verilmesi ise döviz ihtiyacının düşmesi ve makroekonomik dayanıklılığın artması anlamına gelir."},"type":"paragraph"},{"id":"21AGtkmlh_","data":{"amp":"\u003camp-iframe sandbox='allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation' layout=responsive resizable noloading title='Interactive or visual content' src='https://flo.uri.sh/visualisation/27425869/embed?auto=1' width=400 height=300\u003e\u003camp-img layout=fixed height=64 width=64 src='https://public.flourish.studio/resources/bosh.svg' placeholder style='margin: auto'\u003e\u003c/amp-img\u003e\u003cdiv overflow style='position: absolute; bottom: 0; width: 100%; text-align: center; background: #eee; font-family: sans-serif;'\u003eShow more\u003c/div\u003e\u003c/amp-iframe\u003e\u003cp\u003e\u003ca href='https://public.flourish.studio/visualisation/27425869/?utm_source=embed\u0026amp;utm_campaign=visualisation/27425869'\u003e\u003camp-img layout=fixed height=16 width=105 src='https://public.flourish.studio/resources/made_with_flourish.svg' alt='Made with Flourish'\u003e\u003c/amp-img\u003e\u003c/a\u003e\u003c/p\u003e","iframe":"\u003ciframe src='https://flo.uri.sh/visualisation/27425869/embed' title='Interactive or visual content' class='flourish-embed-iframe' frameborder='0' scrolling='no' style='width:100%;height:600px;' sandbox='allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation'\u003e\u003c/iframe\u003e","caption":""},"type":"customEmbed"},{"id":"xSe7FxIl9B","data":{"text":"Bu içerik Doğruluk Payı editörleri tarafından her ay güncellenmektedir.","caption":"","alignment":"left"},"type":"quote"}],"version":"2.22.2"},"references":[{"url":"https://data.tuik.gov.tr/Bulten/Index?p=%C4%B0%C5%9Fg%C3%BCc%C3%BC-%C4%B0statistikleri-Kas%C4%B1m-2025-54068\u0026dil=1","text":"TÜİK - İşgücü İstatistikleri, Aralık 2025"},{"url":"https://data.tuik.gov.tr/Bulten/Index?p=T%C3%BCketici-Fiyat-Endeksi-Aral%C4%B1k-2025-58294\u0026dil=1","text":"
